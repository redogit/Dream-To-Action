name: Verify Dream to Action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-integrity:
    name: Release integrity and reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the exact public repository commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify release hashes, rebuild, entry point, and inline policy
        run: python3 tools/verify.py
      - name: Check application JavaScript syntax
        run: node --check prototype/app.js
